name: Build and deploy NAS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: nas-production
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/sonessica/atchooo-space
  BASE: ghcr.io/sonessica/atchooo-space-runtime
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build clean runtime
        id: runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.BASE }}:node22-ffmpeg-bw2026.6.0
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build standalone application and run tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            RUNTIME_BASE=${{ env.BASE }}@${{ steps.runtime.outputs.digest }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test tools
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify image
        run: node scripts/smoke-image.mjs "$IMAGE:$GITHUB_SHA"
      - name: Publish tested image
        id: publish
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "image=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Deploy without building on NAS
        env:
          SSHPASS: ${{ secrets.NAS_SSH_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_IMAGE: ${{ steps.publish.outputs.image }}
        run: |
          command -v sshpass || (sudo apt-get update -qq && sudo apt-get install -y sshpass)
          mkdir -p ~/.ssh
          printf '%s\n' '[atchooo.com]:338 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIqRF4XfZG48a6Zp07EcC8L4zBvgKSmDiZgnbAh2jEG5' > ~/.ssh/known_hosts
          RELEASE="/share/Container/atchooo-space/releases/$GITHUB_SHA"
          sshpass -e ssh -p 338 MASTER@atchooo.com "mkdir -p '$RELEASE'"
          sshpass -e scp -O -P 338 docker-compose.yml scripts/deploy-nas.sh MASTER@atchooo.com:"$RELEASE/"
          printf '%s' "$REGISTRY_TOKEN" | sshpass -e ssh -p 338 MASTER@atchooo.com "sh '$RELEASE/deploy-nas.sh' '$DEPLOY_IMAGE' '$GITHUB_ACTOR' '$RELEASE'"
