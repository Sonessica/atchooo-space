name: atchooo-space

services:
  atchooo-space:
    build:
      context: .
      args:
        RUNTIME_BASE: ${ATCHOOO_RUNTIME_BASE:-docker.1ms.run/library/node:22-bookworm-slim}
    image: atchooo-space:latest
    container_name: atchooo-space
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: review-placeholder
      NEXT_PUBLIC_APP_URL: https://space.atchooo.com:2096
      HOSTNAME: 0.0.0.0
      ATCHOOO_DB_PATH: /app/data/atchooo-space.sqlite
      ATCHOOO_MEDIA_PATH: /app/data/media
      ATCHOOO_ADMIN_PASSWORD: ${ATCHOOO_ADMIN_PASSWORD:?Set ATCHOOO_ADMIN_PASSWORD in .env}
      ATCHOOO_SESSION_SECRET: ${ATCHOOO_SESSION_SECRET:?Set ATCHOOO_SESSION_SECRET in .env}
      VAULTWARDEN_URL: ${VAULTWARDEN_URL:-}
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_EMAIL:-}
      BW_CLI_PATH: ${BW_CLI_PATH:-}
    volumes:
      - ./data:/app/data
    networks:
      - nas-frontend

networks:
  nas-frontend:
    external: true
