name: atchooo-space

services:
  atchooo-space:
    image: ${ATCHOOO_IMAGE:-ghcr.io/sonessica/atchooo-space:latest}
    container_name: atchooo-space
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: review-placeholder
      NEXT_PUBLIC_APP_URL: https://space.atchooo.com:2096
      HOSTNAME: 0.0.0.0
      ATCHOOO_DB_PATH: /app/data/atchooo-space.sqlite
      ATCHOOO_MEDIA_PATH: /app/data/media
      ATCHOOO_ADMIN_PASSWORD: ${ATCHOOO_ADMIN_PASSWORD:?Set ATCHOOO_ADMIN_PASSWORD in .env}
      ATCHOOO_SESSION_SECRET: ${ATCHOOO_SESSION_SECRET:?Set ATCHOOO_SESSION_SECRET in .env}
      VAULTWARDEN_URL: ${VAULTWARDEN_URL:-}
      VAULTWARDEN_EMAIL: ${VAULTWARDEN_EMAIL:-}
      BW_CLI_PATH: ${BW_CLI_PATH:-/opt/bitwarden/node_modules/@bitwarden/cli/build/bw.js}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/private/editor').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./data:/app/data
    networks:
      - nas-frontend

networks:
  nas-frontend:
    external: true
